name: Build and Release Stick

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Extract Unified APP_VERSION from Cargo.toml
        id: meta
        shell: pwsh
        run: |
          $ver = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          echo "version=$ver" >> $env:GITHUB_OUTPUT

      - name: Run Compatibility & Unit Tests
        env:
          STICK_BUILD_VERSION: ${{ steps.meta.outputs.version }}.${{ github.run_number }}
          # Desktop OAuth Client ID is public, never a client secret.
          # Set repository Actions variable STICK_GOOGLE_CLIENT_ID in Settings.
          STICK_GOOGLE_CLIENT_ID: ${{ vars.STICK_GOOGLE_CLIENT_ID }}
        run: cargo test -- --test-threads=1

      - name: Check Rust lints
        run: cargo clippy

      - name: Build Release EXE
        env:
          STICK_BUILD_VERSION: ${{ steps.meta.outputs.version }}.${{ github.run_number }}
          # Desktop OAuth Client ID is public, never a client secret.
          # Set repository Actions variable STICK_GOOGLE_CLIENT_ID in Settings.
          STICK_GOOGLE_CLIENT_ID: ${{ vars.STICK_GOOGLE_CLIENT_ID }}
        run: cargo build --release

      - name: Package Clean Folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item target/release/Stick.exe dist/Stick.exe
          "${{ steps.meta.outputs.version }}.${{ github.run_number }}" | Out-File -FilePath dist/version.txt -Encoding ascii -NoNewline

          # The public updater downloads this compressed package instead of the
          # ~30 MB raw EXE. Keep Stick.exe in the Release for older clients.
          Compress-Archive -Path dist/Stick.exe -DestinationPath dist/Stick-update.zip -CompressionLevel Optimal -Force

          $exeHash = (Get-FileHash dist/Stick.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $zipHash = (Get-FileHash dist/Stick-update.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          @(
            "$exeHash  Stick.exe"
            "$zipHash  Stick-update.zip"
          ) | Set-Content dist/SHA256SUMS.txt -Encoding ascii

          $tag = "v" + (Get-Content dist/version.txt -Raw)
          $assetName = 'Stick-update.zip'
          @{
            tag_name = $tag
            assets = @(@{
              name = $assetName
              browser_download_url = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$tag/$assetName"
              size = (Get-Item dist/Stick-update.zip).Length
              digest = "sha256:$zipHash"
            })
          } | ConvertTo-Json -Depth 4 | Set-Content dist/update-manifest.json -Encoding utf8NoBOM

      - name: Verify installable update package
        env:
          STICK_BUILD_VERSION: ${{ steps.meta.outputs.version }}.${{ github.run_number }}
        run: cargo test packaged_release_stages_the_exact_built_executable -- --ignored

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Stick-Windows
          # Keep the Actions artifact small like before. The updater ZIP is
          # published to Releases separately and would otherwise be duplicated
          # inside this artifact ZIP.
          path: |
            dist/Stick.exe
            dist/version.txt
            dist/SHA256SUMS.txt

      - name: Publish Direct Release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.meta.outputs.version }}.${{ github.run_number }}
          name: Stick v${{ steps.meta.outputs.version }} (Build ${{ github.run_number }})
          body_path: RELEASE_NOTES.md
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            dist/Stick.exe
            dist/Stick-update.zip
            dist/update-manifest.json
            dist/version.txt
            dist/SHA256SUMS.txt

      - name: Verify upgrade from the published 4.1.1.432 updater
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          STICK_BUILD_VERSION: '4.1.1.432'
        run: |
          git fetch --depth=1 origin tag v4.1.1.432
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force tests | Out-Null
          git show v4.1.1.432:src/updater.rs | Set-Content tests/legacy_upgrade.rs -Encoding utf8NoBOM
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          @'
          #[test]
          fn published_upgrade_matches_this_build() {
              let expected = std::fs::read_to_string("dist/version.txt").unwrap();
              let mut seen = String::new();
              let info = (0..6).find_map(|attempt| {
                  if attempt > 0 { std::thread::sleep(Duration::from_secs(5)); }
                  match check_online(embedded_build_version()) {
                      Ok(Some(info)) if info.version == expected => Some(info),
                      result => { seen = format!("{result:?}"); None }
                  }
              }).unwrap_or_else(|| panic!("Previous updater could not see {expected}: {seen}"));
              let temp = std::env::temp_dir().join(format!("Stick live upgrade {}", std::process::id()));
              std::fs::create_dir(&temp).unwrap();
              let staged = download_verified_with_progress(&info, &temp.join("Stick.exe"), |_, _| {}).unwrap();
              assert_eq!(std::fs::read(staged).unwrap(), std::fs::read("dist/Stick.exe").unwrap());
              std::fs::remove_dir_all(temp).unwrap();
          }
          '@ | Add-Content tests/legacy_upgrade.rs -Encoding utf8NoBOM
          cargo test --test legacy_upgrade published_upgrade_matches_this_build -- --exact
